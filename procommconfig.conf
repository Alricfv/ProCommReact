# NGINX configuration for both direct access and Azure Front Door
# Save this as nginx-cors-fix.conf

server {
    listen 443 ssl;
    server_name #(insert servername here);
    
    # SSL configuration (certbot certificates)
    ssl_certificate /etc/letsencrypt/live/servername/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/servername/privkey.pem;

    # SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    
    # Main location block for API and static files
    location / {
        # Handle OPTIONS requests for CORS preflight
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://alricfv.github.io' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
        
        # Add CORS headers for actual requests
        add_header 'Access-Control-Allow-Origin' 'https://alricfv.github.io' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Origin, Content-Type, Accept, Authorization' always;
        
        # Proxy to your Flask application
        proxy_pass http://localhost:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Pass all headers including Origins
        proxy_pass_request_headers on;
        
        # Increase timeout for transcription
        proxy_read_timeout 300s;
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name #(insert servername here);
    return 301 https://$host$request_uri;
}
